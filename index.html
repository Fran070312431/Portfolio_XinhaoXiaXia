<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Portfolio de Xinhao Xia Xia, Game Designer.">
  <meta name="theme-color" content="#cfe3f3">
  <title>Xinhao Xia Xia — Game Designer</title>

  <!-- Fuentes: con <link> cargan antes que con @import dentro del CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Abel&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <link rel="icon" href="favicon/logo.png" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/Logo.png">
  <link rel="apple-touch-icon" href="favicon/Logo.png">
</head>
<body>
<div id="loading">
  <div class="load-logo">PSP</div>
  <div class="load-sub">loading portfolio</div>
  <div class="load-bar-wrap"><div class="load-bar"></div></div>
</div>
<div id="app">
  <div id="view-carousel">
    <header id="header">
      <div class="header-name">Xinhao Xia Xia</div>
      <div class="header-title">GAME DESIGNER</div>
      <div class="header-sub">PORTFOLIO - 2026</div>
    </header>
    <div id="label-select">— selecciona un juego —</div>

    <div id="carousel-outer">
      <div id="carousel-track"></div>
    </div>

    <div id="game-name-display"></div>
    <div id="game-genre-display"></div>

    <div id="bottom-ui">
      <div id="carousel-nav">
        <button class="arr-btn" id="arr-left" aria-label="Anterior">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div id="dots-nav"></div>
        <button class="arr-btn" id="arr-right" aria-label="Siguiente">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
      <button id="btn-insert">INSERTAR CARTUCHO</button>
    </div>
  </div>

  <!-- Botón de contenido extra (arte, modelado 3D...). Lleva a extra.html.
       DESACTIVADO con "hidden" porque extra.html ya no está en la carpeta
       (daba error 404). Cuando vuelvas a tener extra.html, borra "hidden"
       y descomenta el bloque #btn-extras de style.css. -->
  <button id="btn-extras" aria-label="Contenido extra" hidden>
    <img src="imagenes/Extra.svg" alt="">
  </button>

  <!-- Overlay de transición circular tipo "iris" -->
  <div id="circle-transition">
    <div id="circle-fill"></div>

  </div>

  <div id="view-psp">
    <canvas id="psp-canvas"></canvas>
    <div id="psp-screen">
      <div id="screen-idle">
        <div class="screen-psp-logo">PSP</div>
        <div class="screen-psp-sub">PORTFOLIO</div>
      </div>
      <div id="screen-game">
        <div class="sg-topbar">
          <span class="sg-time" id="sg-time">00:00</span>
          <span class="sg-console">PORTFOLIO XINHAO XIA XIA</span>
          <span class="sg-battery" id="sg-battery">■■■■□ 80%</span>
        </div>
        
        <div class="sg-body">
          <!-- Capas de fondo retro (SIEMPRE detrás, fijas) -->
          <div class="sg-bg"></div>
          <div class="sg-wave"></div>

          <!-- Dos "páginas" fijas (portada / info) que se deslizan
               completas al pulsar la flecha — nada de scroll libre,
               el único control de navegación es la flecha -->
          <div class="sg-content" id="sg-content">
            <div id="sg-bg-img" class="sg-hero-spacer">
            </div>

            <div class="sg-info-page" id="sg-info-page">
              <div class="sg-info-top">
                <h2 class="sg-title-info" id="sg-title-info"></h2>
                <div class="sg-genre-info" id="sg-genre-info"></div>
              </div>

              <p class="sg-desc" id="sg-desc"></p>

              <div class="sg-meta-row">
                <div class="sg-tags" id="sg-tags"></div>
                <div class="sg-year" id="sg-year"></div>
              </div>

              <div class="sg-actions">
                <a id="sg-btn-play" href="#" target="_blank" rel="noopener" class="psp-act-btn btn-play">
                  <span class="psp-icon icon-cross">✖</span> JUGAR
                </a>
                <a id="sg-btn-gdd" href="#" target="_blank" rel="noopener" class="psp-act-btn btn-gdd">
                  <span class="psp-icon icon-triangle">▲</span> VER GDD
                </a>
              </div>
            </div>
          </div>

          <!-- Flecha flotante — único control para cambiar de página -->
          <button type="button" class="sg-scroll-arrow" id="sg-scroll-arrow" aria-label="Ver información">
            <i class="fa-solid fa-chevron-down" id="sg-scroll-arrow-icon"></i>
          </button>
        </div>
        <div class="screen-vignette"></div>
        <div class="screen-glare"></div>
        <div class="screen-scanlines"></div>
      </div>
    </div>
  </div>

  <button id="btn-back">VOLVER AL MENÚ</button>
</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="main.js"></script>
</body>
</html>
