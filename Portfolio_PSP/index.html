<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xinhao Xia Xia — Game Designer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div id="bg-base"></div>
<div id="bg"></div>
<div id="loading">
  <div class="load-logo">PSP</div>
  <div class="load-sub">loading portfolio</div>
  <div class="load-bar-wrap"><div class="load-bar"></div></div>
</div>
<div id="app">
  <div id="view-carousel">
    <header id="header">
      <div class="header-name">Xinhao Xia Xia</div>
      <div class="header-title">GAME DESIGNER</div>
      <div class="header-sub">PORTFOLIO - 2026</div>
    </header>
    <div id="label-select">— selecciona un juego —</div>

    <div id="carousel-outer">
      <div id="carousel-track"></div>
    </div>

    <div id="game-name-display"></div>
    <div id="game-genre-display"></div>

    <div id="bottom-ui">
      <div id="carousel-nav">
        <button class="arr-btn" id="arr-left" aria-label="Anterior">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div id="dots-nav"></div>
        <button class="arr-btn" id="arr-right" aria-label="Siguiente">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
      <button id="btn-insert">INSERTAR CARTUCHO</button>
    </div>
  </div>

  <div id="view-psp">
    <canvas id="psp-canvas"></canvas>
    <div id="psp-screen">
      <div id="screen-idle">
        <div class="screen-psp-logo">PSP</div>
        <div class="screen-psp-sub">PORTFOLIO</div>
      </div>
      <div id="screen-game">
        <div class="sg-topbar">
          <span class="sg-time" id="sg-time">00:00</span>
          <span class="sg-console">PORTFOLIO XINHAO XIA XIA</span>
          <span class="sg-battery" id="sg-battery">■■■■□ 80%</span>
        </div>
        
        <div class="sg-body">
          <!-- Capas de fondo retro (SIEMPRE detrás, fijas) -->
          <div class="sg-bg"></div>
          <div class="sg-wave"></div>

          <!-- Contenido con Scroll: la portada ahora vive AQUÍ dentro,
               como primer bloque, así se desplaza fuera de vista al
               hacer scroll y deja ver el fondo azul detrás de la info -->
          <div class="sg-content" id="sg-content">
            <div id="sg-bg-img" class="sg-hero-spacer">
              <h2 class="sg-title" id="sg-title"></h2>
              <div class="sg-genre" id="sg-genre"></div>
            </div>

            <div class="sg-info-card" id="sg-info-card">
              <p class="sg-desc" id="sg-desc"></p>
              <div class="sg-tags" id="sg-tags"></div>
              <div class="sg-actions">
                <a id="sg-btn-play" href="#" target="_blank" class="psp-act-btn btn-play">
                  <span class="psp-icon icon-cross">✖</span> JUGAR
                </a>
                <a id="sg-btn-gdd" href="#" target="_blank" class="psp-act-btn btn-gdd">
                  <span class="psp-icon icon-triangle">▲</span> VER GDD
                </a>
              </div>
            </div>
          </div>

          <!-- Flecha flotante -->
          <div class="sg-scroll-arrow" id="sg-scroll-arrow">
            <i class="fa-solid fa-chevron-down"></i>
          </div>
        </div>
        <div class="screen-vignette"></div>
        <div class="screen-glare"></div>
        <div class="screen-scanlines"></div>
      </div>
    </div>
  </div>

  <button id="btn-back">VOLVER AL MENÚ</button>
</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="main.js"></script>
</body>
</html>
