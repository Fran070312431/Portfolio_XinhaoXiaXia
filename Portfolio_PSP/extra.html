<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xinhao Xia Xia — Contenido Extra</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/Logo.png">
</head>
<body>
<div id="bg-base"></div>
<div id="bg"></div>

<div id="app">

  <!-- Botón de volver — icono de "cartucho" (disco UMD), sin texto -->
  <button id="btn-back-extra" aria-label="Volver al menú">
    <i class="fa-solid fa-compact-disc"></i>
  </button>

  <header class="xmb-header">
    <div class="header-name">Xinhao Xia Xia</div>
    <div class="header-title">CONTENIDO EXTRA</div>
    <div class="header-sub">ARTE · MODELADO 3D · DOCUMENTOS</div>
  </header>

  <div class="xmb-wrap">
    <!-- Barra vertical de categorías (izquierda) -->
    <div class="xmb-sidebar" id="xmb-sidebar"></div>

    <!-- Título de la categoría activa, centrado -->
    <div class="xmb-title-wrap">
      <div class="xmb-cat-title" id="xmb-cat-title"></div>
      <div class="xmb-cat-sub" id="xmb-cat-sub"></div>
    </div>

    <!-- Barra horizontal de contenido (abajo) -->
    <div class="xmb-content-bar" id="xmb-content-bar"></div>
  </div>

  <!-- Overlay de transición circular — arranca "tapado" y se destapa
       al cargar, para continuar la animación que empezó en index.html -->
  <div id="circle-transition">
    <div id="circle-fill"></div>
  </div>

</div>

<script src="extra.js"></script>
</body>
</html>
